name: koshshield

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: koshshield
      POSTGRES_USER: koshshield
      POSTGRES_PASSWORD: koshshield
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koshshield -d koshshield"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  tool-runner:
    build:
      context: ./tools/runner
    image: koshshield-tool-runner:0.1.0
    profiles: ["tools"]
    network_mode: "none"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    user: "65534:65534"
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5

volumes:
  postgres_data:
  qdrant_storage:
